[project]
name = "smws-api"
version = "0.1.0"
description = "FastAPI backend for synchronizing and searching SMWS whisky data."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.16,<2",
    "beautifulsoup4>=4.13,<5",
    "fastapi>=0.116,<1",
    "httpx>=0.28,<1",
    "numpy>=2.5.2",
    "paddleocr==3.3.1",
    "pillow>=12.3.0",
    "pydantic-settings>=2.10,<3",
    "python-multipart>=0.0.32",
    "rapidfuzz>=3.13,<4",
    "setuptools>=84.0.0",
    "sqlalchemy>=2.0,<3",
    "uvicorn[standard]>=0.35,<1",
]

[dependency-groups]
dev = [
    "pytest>=8.4,<9",
    "ruff>=0.12,<1",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
